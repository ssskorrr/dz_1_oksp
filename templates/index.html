<!doctype html><html lang="ru"><meta charset="utf-8"><title>kirill_skorikov — Запись к специалисту</title>
<style>body{font:16px Arial;max-width:1180px;margin:32px auto;background:#f7f9fc;color:#162333}h1{font-size:28px}section{background:white;border:1px solid #dde3ed;padding:20px;margin:18px 0;border-radius:8px}button,input,select{font:inherit;padding:8px;margin:4px}button{cursor:pointer;background:#125dc1;color:white;border:0;border-radius:4px}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}table{border-collapse:collapse;width:100%}#message{white-space:pre-wrap}small{color:#58677b}pre{white-space:pre-wrap}</style>
<h1>Запись к специалисту</h1><small>kirill_skorikov · курсовая работа · вариант 3 · PostgreSQL</small>
<section><label>Логин <input id="username" value="demo"></label><label>Пароль <input id="password" type="password" value="demo"></label><button onclick="login()">Войти</button><span id="session"></span></section>
<p id="message" role="status"></p>
<section><h2>Свободные слоты и бронирование</h2><label>Услуга <select id="services"></select></label><label>Специалист <select id="specialists"></select></label><label>С <input id="from" type="date" value="2026-11-01"></label><label>До <input id="to" type="date" value="2027-02-01"></label><button onclick="loadSlots()">Найти слоты</button><div id="slots"></div></section>
<section><h2>Мои записи</h2><label>Статус <select id="status"><option value="active">Активные</option><option value="cancelled">Отменённые</option><option value="all">Все</option></select></label><button onclick="page=1;loadBookings()">Показать</button><div id="bookings"></div><button onclick="if(page>1){page--;loadBookings()}">Предыдущая</button><button onclick="if(page*10<total){page++;loadBookings()}">Следующая</button><p id="pages"></p></section>
<section><h2>Карточка записи</h2><div id="card">Выберите запись в списке.</div></section>
<section><h2>Сводка загрузки за выбранный период</h2><button onclick="loadSummary()">Обновить сводку</button><div id="summary"></div></section>
<script>
let authorization='',page=1,total=0;
const el=id=>document.getElementById(id);
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){let r=await fetch('/api/'+path,{...options,headers:{Authorization:authorization,'Content-Type':'application/json'},cache:'no-store'});let data=await r.json();if(!r.ok){el('message').textContent=data.error;throw Error(data.error)}el('message').textContent=`Операция выполнена · ${r.headers.get('X-Total-Ms')} мс · запросов к БД: ${r.headers.get('X-DB-Queries')}`;return data}
function table(headers,rows){return '<table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function dates(){return '&from='+el('from').value+'&to='+el('to').value}
async function login(){authorization='Basic '+btoa(el('username').value+':'+el('password').value);try{let services=await api('services'),specialists=await api('specialists');el('services').innerHTML=services.items.map(s=>`<option value="${s.id}">${safe(s.name)} · ${s.duration_minutes} мин.</option>`).join('');el('specialists').innerHTML=specialists.items.map(s=>`<option value="${s.id}">${safe(s.name)}</option>`).join('');el('session').textContent='Вход выполнен';await loadBookings();await loadSummary()}catch(e){el('session').textContent='Ошибка входа'}}
async function loadSlots(){let d=await api(`slots?service_id=${el('services').value}&specialist_id=${el('specialists').value}${dates()}`);el('slots').innerHTML=`<p>Свободных слотов: ${d.total}, показано: ${d.items.length}</p>`+table(['Слот','Начало','Конец','Действие'],d.items.map(s=>[s.id,safe(s.starts_at),safe(s.ends_at),`<button onclick="book(${s.id})">Забронировать</button>`]))}
async function book(id){await api('bookings',{method:'POST',body:JSON.stringify({slot_id:id,service_id:Number(el('services').value)})});await loadSlots();await loadBookings();await loadSummary()}
async function loadBookings(){let d=await api(`bookings?page=${page}&size=10&status=${el('status').value}`);total=d.total;el('bookings').innerHTML=table(['№','Специалист','Услуга','Начало','Статус','Действия'],d.items.map(b=>[b.id,safe(b.specialist),safe(b.service),safe(b.starts_at),b.status,`<button onclick="card(${b.id})">Карточка</button>`+(b.status==='active'?`<button onclick="cancel(${b.id})">Отменить</button>`:'')]));el('pages').textContent=`Страница ${page}, записей ${total}`}
async function card(id){let d=await api('bookings/'+id);el('card').innerHTML=Object.entries(d).map(([k,v])=>`<p><b>${safe(k)}</b>: ${safe(v)}</p>`).join('')}
async function cancel(id){await api(`bookings/${id}/cancel`,{method:'POST',body:'{}'});await loadBookings();await loadSummary()}
async function loadSummary(){let d=await api('summary?'+dates().slice(1));el('summary').innerHTML=`<p>Записей за период: ${d.total_bookings}; отменено: ${d.cancelled}</p>`+table(['Специалист','Записей','Отменено','Загрузка','Доля отмен'],d.items.map(s=>[safe(s.name),s.total,s.cancelled,(s.utilization*100).toFixed(1)+'%',(s.cancellation_share*100).toFixed(1)+'%']))}
</script></html>
